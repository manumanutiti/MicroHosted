# The image mh sandbox runs code in (docs/sandbox.md): Ubuntu 24.04, so that
# code expecting glibc — native npm modules, manylinux wheels, prebuilt
# binaries (esbuild, Prisma, Playwright) — runs as it would on a developer's
# machine. The code runs as dev, in bash, in ~/work. alpine.yml, next to this
# file, is a smaller one without audit.
#
#   mh build -t sandbox:1 sandbox
#   mh sandbox ./repo 'npm test' --fetch 'npm ci --ignore-scripts'
#
# By hand, what mh sandbox does without a network to fetch on:
#
#   tar -czf /tmp/code.tgz -C ./code .
#   VM=$(mh run sandbox:1 --wait)
#   mh cp /tmp/code.tgz $VM:/root/code.tgz
#   mh exec $VM mh-sandbox-prepare /root/code.tgz   # decoys, audit, the clock
#   mh exec $VM mh-sandbox-scan                     # text addressed to an AI agent
#   mh exec -t 5m $VM mh-sandbox-run 'npm ci && npm test'
#   mh exec $VM mh-sandbox-report
#   mh flows $VM
#   mh rm $VM
#
# For the report to stay exact:
#   - root is locked: the base leaves it with an empty password for the
#     serial console, and su with an empty password is root for anyone;
#   - the code becomes dev with setpriv, not su: no PAM, no session, no log;
#   - systemd writes nothing on its own once booted: the journal is kept in
#     memory and every timer is masked. A prepared VM where nothing runs
#     reports nothing — anything in the report is the code's.
name: sandbox
base: ubuntu:24.04

# A developer's machine: git, curl, Python with venv, a C toolchain (native
# npm modules, sdists), Node (the LTS, below: Ubuntu's 18 is too old for most
# of npm), unzip and xz (installers unpack with them). Add the rest with
# --apt (golang…). procps and iproute2 are the
# report's (ps, ss); auditd too: which paths the code asked for that tell a
# VM apart (/sys/class/dmi, /proc/cpuinfo…), found or not, what it ran, and
# the alerts (a setuid(0) refused, a write to ~/.ssh/authorized_keys, a
# reverse shell's command line…).
packages:
  - ca-certificates
  - curl
  - openssl
  - git
  - python3
  - python3-venv
  - build-essential
  - unzip
  - xz-utils
  - procps
  - iproute2
  - auditd

files:
  /usr/sbin/mh-sandbox-lib: sbin/mh-sandbox-lib
  /usr/sbin/mh-sandbox-prepare: sbin/mh-sandbox-prepare
  /usr/sbin/mh-sandbox-unpack: sbin/mh-sandbox-unpack
  /usr/sbin/mh-sandbox-run: sbin/mh-sandbox-run
  /usr/sbin/mh-sandbox-report: sbin/mh-sandbox-report
  /usr/sbin/mh-sandbox-scan: sbin/mh-sandbox-scan
  /usr/sbin/mh-sandbox-watch: sbin/mh-sandbox-watch
  /usr/sbin/mh-sandbox-net: sbin/mh-sandbox-net
  /usr/local/bin/mh-sandbox-try: sbin/mh-sandbox-try
  /usr/local/bin/mh-sandbox-sdist: sbin/mh-sandbox-sdist
  /usr/share/mh-sandbox/agent-patterns: agent-patterns
  /usr/share/mh-sandbox/trace.bash: trace.bash
  /usr/share/mh-sandbox/sh.c: sh.c

run:
  # Node, the 24 LTS line's newest, from nodejs.org, checked against its
  # SHASUMS256.txt: node, npm, npx, corepack (pnpm, yarn) in /usr/local
  # (not on the build's PATH; on the code's, mh-sandbox-lib).
  - cd /tmp && b=https://nodejs.org/dist/latest-v24.x && curl -fsSL -o SHASUMS256.txt $b/SHASUMS256.txt && f=$(awk '/ node-v[0-9.]+-linux-x64[.]tar[.]xz$/ {print $2}' SHASUMS256.txt) && curl -fsSL -o "$f" "$b/$f" && grep " $f\$" SHASUMS256.txt | sha256sum -c - && tar -xJf "$f" -C /usr/local --strip-components=1 --no-same-owner --exclude=CHANGELOG.md --exclude=README.md --exclude=LICENSE && rm -f "$f" SHASUMS256.txt && PATH=/usr/local/bin:$PATH && node --version && npm --version
  # The user the code runs as: a home from /etc/skel, bash, no password, no
  # sudo (not installed).
  - useradd -m -s /bin/bash dev
  # mh-sandbox-net's: the sinkhole parses what the code sends, as neither root nor the code
  - useradd -r -M -d /nonexistent -s /usr/sbin/nologin mhsink
  - echo U=dev > /etc/mh-sandbox.conf && chmod 0600 /etc/mh-sandbox.conf
  - passwd -l root
  # No setuid or setgid file anywhere (su, passwd, mount, chsh…): nothing
  # for dev to escalate through. Root needs none of them.
  - find / -xdev -type f -perm /6000 -exec chmod ug-s {} +
  # Quiet once booted: the journal in memory, no timer (apt, logrotate,
  # tmpfiles, fstrim…). What is left writing is the code.
  - mkdir -p /etc/systemd/journald.conf.d && printf '[Journal]\nStorage=volatile\n' > /etc/systemd/journald.conf.d/mh-sandbox.conf
  - systemctl list-unit-files --type=timer --no-legend | awk '{print $1}' | xargs -r systemctl mask
  # audit's log is never rotated away: the first thing the code asks for is
  # often the one that matters.
  - sed -i 's/^max_log_file_action = .*/max_log_file_action = keep_logs/' /etc/audit/auditd.conf
  # Files of 256 MB, not 8: mh sandbox -v follows the log as it grows, and
  # code that walks the filesystem writes megabytes a second.
  - sed -i 's/^max_log_file = .*/max_log_file = 256/' /etc/audit/auditd.conf
  # The disk's guard: audit stops recording (SUSPEND) with 150 MB left, so
  # that a log that grows without end (code walking the filesystem for
  # minutes) leaves room for the report; the report says so when it happened.
  - sed -i -e 's/^space_left = .*/space_left = 300/' -e 's/^admin_space_left = .*/admin_space_left = 150/' -e 's/^admin_space_left_action = .*/admin_space_left_action = SUSPEND/' -e 's/^disk_full_action = .*/disk_full_action = SUSPEND/' /etc/audit/auditd.conf
  # The syscall's name and the address connected to in each record
  # (SYSCALL=, SADDR=), which mh-sandbox-lib reads.
  - sed -i 's/^log_format = .*/log_format = ENRICHED/' /etc/audit/auditd.conf
  - grep -q '^admin_space_left = 150$' /etc/audit/auditd.conf && grep -q '^log_format = ENRICHED$' /etc/audit/auditd.conf
  # /bin/sh: bash, traced, for the code (MH_TRACE, mh-sandbox-run); dash
  # for everything else (sh.c). trace.bash is read by the code's shells.
  # Diverted: an apt install (--apt) does not put dash back.
  - cc -O2 -Wall -Werror -o /usr/bin/sh.mh /usr/share/mh-sandbox/sh.c && dpkg-divert --local --rename --add /usr/bin/sh && mv -f /usr/bin/sh.mh /usr/bin/sh && rm -f /usr/share/mh-sandbox/sh.c && chmod 0644 /usr/share/mh-sandbox/trace.bash
  - test "$(/bin/sh -c 'echo -n a; echo "b\tc"')" = "$(printf 'ab\tc')" && test "$(MH_TRACE=1 BASH_ENV=/usr/share/mh-sandbox/trace.bash /bin/sh -c 'echo -n a; echo "b\tc"')" = "$(printf 'ab\tc')"
  - chmod 0700 /usr/sbin/mh-sandbox-prepare /usr/sbin/mh-sandbox-unpack /usr/sbin/mh-sandbox-run /usr/sbin/mh-sandbox-report /usr/sbin/mh-sandbox-scan /usr/sbin/mh-sandbox-watch /usr/sbin/mh-sandbox-net
  - chmod 0600 /usr/sbin/mh-sandbox-lib /usr/share/mh-sandbox/agent-patterns
  # the code's user runs it: root's, readable
  - chmod 0755 /usr/local/bin/mh-sandbox-try /usr/local/bin/mh-sandbox-sdist
  - sh -n /usr/sbin/mh-sandbox-lib && sh -n /usr/sbin/mh-sandbox-prepare && sh -n /usr/sbin/mh-sandbox-unpack && sh -n /usr/sbin/mh-sandbox-run && sh -n /usr/sbin/mh-sandbox-report && sh -n /usr/sbin/mh-sandbox-scan && sh -n /usr/sbin/mh-sandbox-watch && sh -n /usr/local/bin/mh-sandbox-try && python3 -m py_compile /usr/sbin/mh-sandbox-net /usr/local/bin/mh-sandbox-sdist && rm -rf /usr/sbin/__pycache__ /usr/local/bin/__pycache__

mem_mb: 512
# Room for audit's log — every file the code opens is in it — and for a
# build's dependencies.
disk_mb: 4096
