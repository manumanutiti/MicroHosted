[defaults]
inventory = /etc/ansible/inventory.ini
# The lab's key: a secret ../microse.yml writes into the VM (keys/id_lab).
private_key_file = /etc/ansible/id_lab
remote_user = ansible
interpreter_python = /usr/bin/python3
forks = 5
# Every node makes its own host key at boot, and a replaced node comes back
# with a new one: there is no known_hosts to check it against. The lab
# network is closed and the engine lets each VM send only from its own
# address, so the address is the node.
host_key_checking = False

[ssh_connection]
pipelining = True
