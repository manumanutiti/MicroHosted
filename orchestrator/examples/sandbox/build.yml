# A VM to run code you do not trust and see what it did: the connections its
# network refused (seen by the host), the decoy credentials it read, the files
# it created or changed, what it left running. Alpine, nothing installed:
# add the code's toolchain to packages (python3, nodejs npm, go…). Code that
# expects glibc (native npm modules, manylinux wheels, prebuilt binaries)
# belongs in the Ubuntu one: ubuntu.yml, next to this file.
#
#   mh build -t sandbox:1 orchestrator/examples/sandbox
#
#   tar -czf /tmp/code.tgz -C ./code .              # what to run (mh cp copies single files)
#   VM=$(mh run sandbox:1 --no-net --wait)          # or a network with only what the code needs
#   mh cp /tmp/code.tgz $VM:/root/code.tgz
#   mh exec $VM mh-sandbox-prepare /root/code.tgz       # unpacked as runner, decoys in place, the clock starts
#   mh exec -t 5m $VM mh-sandbox-run 'sh install.sh'  # as runner, no way to gain privileges
#   mh exec $VM mh-sandbox-report                   # decoys read, files changed, processes left
#   mh flows $VM                                    # connections it tried that the network refused
#   mh rm $VM
#
# How far to trust the report: the code runs as runner, a user with no
# password, no sudo, no setuid binary in the image and no_new_privs set; the
# guest kernel has no vsock loopback, so runner cannot reach the root agent
# either. The report holds while runner did not become root — only root can
# set a file's ctime, and the decoys' reads and resets show in theirs. Root
# through a guest kernel exploit could hide from the report, not from the
# host: mh flows is the host's view, whatever happened inside.
name: sandbox
base: alpine:3.22

files:
  /usr/sbin/mh-sandbox-lib: sbin/mh-sandbox-lib
  /usr/sbin/mh-sandbox-prepare: sbin/mh-sandbox-prepare
  /usr/sbin/mh-sandbox-run: sbin/mh-sandbox-run
  /usr/sbin/mh-sandbox-report: sbin/mh-sandbox-report

run:
  # The user the code runs as: no password (su from root needs none).
  - adduser -D -s /bin/sh runner
  # No setuid or setgid file anywhere: nothing for runner to escalate through.
  - find / -xdev -type f -perm +6000 -exec chmod ug-s {} +
  # The tools are root's: runner can neither run them nor read which files
  # are decoys.
  - chmod 0700 /usr/sbin/mh-sandbox-prepare /usr/sbin/mh-sandbox-run /usr/sbin/mh-sandbox-report
  - chmod 0600 /usr/sbin/mh-sandbox-lib
  - sh -n /usr/sbin/mh-sandbox-prepare && sh -n /usr/sbin/mh-sandbox-run && sh -n /usr/sbin/mh-sandbox-report

mem_mb: 256
