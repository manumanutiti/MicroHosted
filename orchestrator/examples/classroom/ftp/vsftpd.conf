# Anonymous, read-only FTP of /srv/ftp (the ftp user's home: vsftpd's
# anonymous root, owned by root and not writable, as vsftpd requires).
listen=YES
listen_ipv6=NO
anonymous_enable=YES
no_anon_password=YES
anon_root=/srv/ftp
local_enable=NO
write_enable=NO
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100
ftpd_banner=school.lan file server: course materials, read-only
secure_chroot_dir=/var/run/vsftpd/empty
xferlog_enable=YES
