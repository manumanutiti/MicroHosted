# The page, and /api/ passed to the API on the stack's network (its address
# is fixed in ../microse.yml).
server {
    listen 8080 default_server;
    root /srv/www;
    access_log off;

    location = /healthz {
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://172.30.60.11:8080;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
}
