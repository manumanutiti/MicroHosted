# The stack's API: a Node.js service on Ubuntu that counts visits in the
# database. What it tests of mh build: a large dependency tree from apt (npm
# brings a few hundred packages: the PACKAGES layer is the expensive one),
# and a run step with the network (npm install fetches pg from the npm
# registry).
#
#   mh build orchestrator/examples/stack/api
#
# steps: rather than files: and run:, so the install comes before the code:
# edit app/server.js and build again, and only the last COPY and the check
# run — npm install is taken from the cache with everything before it. Edit
# app/package.json, and npm install runs again.

name: stack-api
base: ubuntu:24.04

packages:
  - nodejs
  - npm

steps:
  - run: useradd --system --home /opt/api --shell /usr/sbin/nologin api
  - copy: {/opt/api/package.json: app/package.json}
  - run: cd /opt/api && npm install --omit=dev --no-audit --no-fund && npm cache clean --force
  - copy: {/opt/api/: app/}
  - run: node --check /opt/api/server.js && node --check /opt/api/health.js   # a syntax error fails the build

# The database's address is the plant spec's to give: ../microse.yml sets
# the command (this one is for mh run alone, against a local database).
command: setpriv --reuid=api --regid=api --init-groups node /opt/api/server.js 8080 127.0.0.1
health:
  command: node /opt/api/health.js
  every: 10s
  timeout: 3s
  failures: 3

vcpus: 1
mem_mb: 256
